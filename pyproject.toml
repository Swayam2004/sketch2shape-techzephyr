[project]
name = "sketch2shape"
version = "0.1.0"
description = "Sketch to textured 3D asset pipeline for TechZephyr 4.0"
readme = "README.md"
requires-python = ">=3.10"
# Heavy ML deps (torch, diffusers, TripoSR) get added once VRAM tests settle the model choice.
dependencies = [
    "gradio",
    "numpy",
    "pillow",
    "opencv-python-headless",
    "trimesh",
    "rembg",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sketch2shape"]

[tool.ruff]
line-length = 100
