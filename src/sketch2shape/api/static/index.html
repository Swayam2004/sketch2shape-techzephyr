<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch2Shape dashboard</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#14161a; --card:#1d2026; --line:#2c313a; --fg:#e6e8eb; --dim:#8b93a1; --ok:#4cc38a; --run:#e5a93d; --bad:#e5604d; --bar:#5b8def; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  #health { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px 20px; }
  @media (max-width:800px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  label { display:block; color:var(--dim); font-size:12px; margin:10px 0 4px; }
  input[type=text], input[type=number], input[type=password] { width:100%; padding:7px 9px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { margin-top:12px; width:100%; padding:9px; background:var(--bar); color:#fff; border:0; border-radius:6px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #sketchPreview { max-width:100%; margin-top:10px; border-radius:6px; background:#fff; display:none; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--line); }
  .pill.queued { color:var(--dim); } .pill.running { color:var(--run); } .pill.done { color:var(--ok); } .pill.failed { color:var(--bad); }
  .steps { display:flex; gap:6px; margin:12px 0; }
  .step { flex:1; text-align:center; padding:8px 4px; border-radius:6px; background:var(--bg); border:1px solid var(--line); color:var(--dim); font-size:12px; }
  .step.active { border-color:var(--run); color:var(--run); animation:pulse 1s infinite; }
  .step.done { border-color:var(--ok); color:var(--ok); }
  @keyframes pulse { 50% { opacity:.5; } }
  .row { display:grid; grid-template-columns:100px 1fr 70px; gap:8px; align-items:center; margin:5px 0; font-size:13px; }
  .track { height:10px; background:var(--bg); border-radius:5px; overflow:hidden; }
  .fill { height:100%; background:var(--bar); }
  .num { text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  .warn { color:var(--run); margin:4px 0; }
  .err { color:var(--bad); }
  .imgs { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .imgs img, model-viewer { width:100%; border-radius:6px; background:#fff; }
  model-viewer { height:340px; background:#2a2e36; }
  .links a { color:var(--bar); margin-right:14px; }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Sketch2Shape dashboard</h1>
  <span id="health">connecting…</span>
</header>
<main>
  <div class="card">
    <h2>New job</h2>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
    <img id="sketchPreview" alt="sketch preview">
    <label for="prompt">Prompt (optional, 300 characters)</label>
    <input id="prompt" type="text" maxlength="300" placeholder="a wooden chair">
    <label for="seed">Seed</label>
    <input id="seed" type="number" value="0">
    <label for="code">Access code (only if the server sets one)</label>
    <input id="code" type="password">
    <button id="go" disabled>Generate</button>
    <p id="submitMsg" class="dim"></p>
  </div>

  <div class="col">
    <div class="card">
      <h2>Job</h2>
      <div><span id="status" class="pill">no job</span> <span id="meta" class="dim"></span></div>
      <div class="steps" id="steps"></div>
      <div id="timings"></div>
      <div id="warnings"></div>
      <div id="error" class="err"></div>
    </div>
    <div class="card" id="outputs" style="display:none">
      <h2>Output</h2>
      <div class="imgs">
        <div><div class="dim">Generated image</div><img id="genImg" alt="generated"></div>
        <div><div class="dim">Mesh (drag to rotate)</div><model-viewer id="viewer" camera-controls auto-rotate shading-intensity="1"></model-viewer></div>
      </div>
      <p class="links" id="links"></p>
      <p class="dim" id="viewerNote"></p>
    </div>
  </div>
</main>

<script>
const STAGES = ["preprocess", "generate", "cutout", "reconstruct", "export"];
const $ = (id) => document.getElementById(id);
let timer = null;

const headers = () => { const c = $("code").value; return c ? { "X-Access-Code": c } : {}; };

async function refreshHealth() {
  try {
    const h = await (await fetch("/v1/health")).json();
    $("health").textContent = `${h.device}${h.gpu_name ? " · " + h.gpu_name : ""} · queue ${h.queue_length} · v${h.version}`;
  } catch { $("health").textContent = "server unreachable"; }
}
setInterval(refreshHealth, 3000); refreshHealth();

$("file").addEventListener("change", () => {
  const f = $("file").files[0];
  $("go").disabled = !f;
  if (f) { $("sketchPreview").src = URL.createObjectURL(f); $("sketchPreview").style.display = "block"; }
});

$("go").addEventListener("click", async () => {
  const form = new FormData();
  form.append("sketch", $("file").files[0]);
  if ($("prompt").value) form.append("prompt", $("prompt").value);
  form.append("seed", $("seed").value || "0");
  $("go").disabled = true; $("submitMsg").textContent = "Submitting…";
  const r = await fetch("/v1/jobs", { method: "POST", body: form, headers: headers() });
  $("go").disabled = false;
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    $("submitMsg").textContent = `${r.status}: ${body.detail || r.statusText}`;
    return;
  }
  const { job_id } = await r.json();
  $("submitMsg").textContent = `Job ${job_id.slice(0, 8)} submitted.`;
  $("outputs").style.display = "none";
  clearInterval(timer);
  timer = setInterval(() => poll(job_id), 1000); poll(job_id);
});

async function poll(id) {
  const r = await fetch(`/v1/jobs/${id}`, { headers: headers() });
  if (!r.ok) { $("error").textContent = `Status ${r.status}`; clearInterval(timer); return; }
  render(await r.json());
}

function render(j) {
  const pill = $("status"); pill.textContent = j.status; pill.className = "pill " + j.status;
  const q = j.status === "queued" ? ` · queue position ${j.queue_position}` : "";
  $("meta").textContent = `${j.elapsed_seconds}s elapsed${q}${j.device ? " · " + j.device : ""}`;

  // Timings only arrive when the job ends, so infer finished stages from the active one.
  const activeIdx = STAGES.indexOf(j.stage);
  $("steps").innerHTML = STAGES.map((s, i) => {
    const cls = s === j.stage ? "active" : j.status === "done" || (activeIdx >= 0 && i < activeIdx) ? "done" : "";
    return `<div class="step ${cls}">${s}</div>`;
  }).join("");

  const max = Math.max(1, ...j.timings.map((t) => t.seconds));
  $("timings").innerHTML = j.timings.map((t) =>
    `<div class="row"><span>${t.stage}</span><div class="track"><div class="fill" style="width:${(t.seconds / max) * 100}%"></div></div>` +
    `<span class="num">${t.seconds}s${t.peak_vram_mb ? " · " + Math.round(t.peak_vram_mb) + " MB" : ""}</span></div>`).join("");
  $("warnings").innerHTML = j.warnings.map((w) => `<div class="warn">${w}</div>`).join("");
  $("error").textContent = j.error || "";

  if (j.status === "done" || j.status === "failed") clearInterval(timer);
  if (j.status === "done") showOutputs(j);
}

async function showOutputs(j) {
  const base = `/v1/jobs/${j.job_id}`;
  // Fetch as blobs so the access code header applies to image and model requests too.
  const blobUrl = async (name) => URL.createObjectURL(await (await fetch(`${base}/${name}`, { headers: headers() })).blob());
  $("genImg").src = await blobUrl("generated.png");
  const glb = await blobUrl("result.glb");
  $("viewer").src = glb;
  $("links").innerHTML = ["result.glb", "result.obj", "generated.png"].map((n) => `<a href="${base}/${n}" download>${n}</a>`).join("") +
    (j.silhouette_iou != null ? `<span class="dim">silhouette IoU ${j.silhouette_iou.toFixed(3)}</span>` : "");
  $("viewerNote").textContent = customElements.get("model-viewer") ? "" : "3D viewer script did not load (needs internet). Download the .glb and open it in Blender.";
  $("outputs").style.display = "block";
}
</script>
</body>
</html>
